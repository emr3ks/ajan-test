<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b16" />
    <meta name="description" content="Toplama, çıkarma, çarpma ve bölme işlemlerini yapabilen tek sayfalık hesap makinesi." />
    <title>Hesap Makinesi</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b16;
        --surface: rgba(148, 163, 184, 0.07);
        --surface-hover: rgba(148, 163, 184, 0.14);
        --stroke: rgba(148, 163, 184, 0.18);
        --text: #e8eefc;
        --muted: #8b9ac4;
        --accent: #67e8f9;
        --accent-strong: #22d3ee;
        --violet: #818cf8;
        --danger: #fda4af;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(58rem 58rem at 12% -12%, rgba(34, 211, 238, 0.2), transparent 60%),
          radial-gradient(52rem 52rem at 112% 112%, rgba(129, 140, 248, 0.24), transparent 58%),
          radial-gradient(40rem 40rem at 50% 50%, rgba(15, 23, 42, 0.6), transparent 70%),
          var(--bg);
        overflow-x: hidden;
      }

      .calculator {
        width: min(100%, 24rem);
        padding: 1.5rem;
        border-radius: 2rem;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.82), rgba(13, 20, 38, 0.92));
        border: 1px solid rgba(148, 163, 184, 0.16);
        box-shadow:
          0 2rem 5rem -1.5rem rgba(2, 6, 23, 0.95),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset,
          0 1px 0 rgba(255, 255, 255, 0.07) inset;
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0 0.25rem 0.95rem;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .brand__dot {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--violet));
        box-shadow: 0 0 0.75rem rgba(103, 232, 249, 0.8);
      }

      .screen {
        margin-bottom: 1.1rem;
        padding: 1.1rem 1.25rem 1.35rem;
        border-radius: 1.4rem;
        background: rgba(2, 6, 23, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.12);
        box-shadow: inset 0 2px 1.2rem rgba(0, 0, 0, 0.38);
        overflow: hidden;
      }

      .screen__expression {
        min-height: 1.4rem;
        text-align: right;
        color: var(--muted);
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .screen__value {
        display: block;
        text-align: right;
        font-size: clamp(2.4rem, 9vw, 3.25rem);
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .screen__value.is-error {
        color: var(--danger);
        font-size: clamp(1.7rem, 7vw, 2.3rem);
      }

      .screen__value.is-long {
        font-size: clamp(1.6rem, 6.2vw, 2.55rem);
      }

      .screen__value.is-longer {
        font-size: clamp(1.3rem, 4.9vw, 1.95rem);
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.65rem;
      }

      .key {
        appearance: none;
        border: 1px solid var(--stroke);
        background: var(--surface);
        color: var(--text);
        border-radius: 1.1rem;
        min-height: 3.6rem;
        font: inherit;
        font-size: 1.35rem;
        font-weight: 500;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .key:active,
      .key.is-pressed {
        transform: scale(0.96);
        background: var(--surface-hover);
      }

      .key:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .key--function {
        color: var(--danger);
        background: rgba(244, 63, 94, 0.08);
        border-color: rgba(244, 63, 94, 0.2);
      }

      .key--function:active,
      .key--function.is-pressed {
        background: rgba(244, 63, 94, 0.16);
      }

      .key--operator {
        color: var(--accent);
        background: rgba(34, 211, 238, 0.1);
        border-color: rgba(34, 211, 238, 0.22);
        font-size: 1.6rem;
        font-weight: 600;
      }

      .key--operator:active,
      .key--operator.is-pressed {
        background: rgba(34, 211, 238, 0.18);
      }

      .key--equals {
        border: 1px solid transparent;
        background: linear-gradient(140deg, var(--accent-strong), var(--violet));
        color: #06121d;
        font-weight: 700;
        box-shadow: 0 0.7rem 1.6rem -0.5rem rgba(34, 211, 238, 0.6);
      }

      .key--equals:active,
      .key--equals.is-pressed {
        background: linear-gradient(140deg, var(--accent-strong), var(--violet));
        transform: scale(0.96);
        filter: brightness(1.05);
      }

      .key--span-2 {
        grid-column: span 2;
      }

      .key svg {
        width: 1.4rem;
        height: 1.4rem;
        display: block;
      }

      @media (hover: hover) {
        .key:hover {
          background: var(--surface-hover);
        }

        .key--function:hover {
          background: rgba(244, 63, 94, 0.15);
        }

        .key--operator:hover {
          background: rgba(34, 211, 238, 0.17);
        }

        .key--equals:hover {
          background: linear-gradient(140deg, var(--accent-strong), var(--violet));
          filter: brightness(1.06);
        }
      }

      @media (max-width: 22rem) {
        .calculator {
          padding: 1.1rem;
          border-radius: 1.6rem;
        }

        .keys {
          gap: 0.5rem;
        }

        .key {
          min-height: 3.2rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="Hesap makinesi">
      <div class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        Hesap Makinesi
      </div>

      <section class="screen" aria-live="polite" aria-atomic="true">
        <div class="screen__expression" id="expression">&nbsp;</div>
        <output class="screen__value" id="display">0</output>
      </section>

      <div class="keys" role="group" aria-label="Tuş takımı">
        <button class="key key--function key--span-2" type="button" data-clear aria-label="Tümünü temizle">AC</button>
        <button class="key key--function" type="button" data-backspace aria-label="Son karakteri sil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M9 5h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9L3 12l6-7Z" />
            <path d="m13 9 4 6M17 9l-4 6" />
          </svg>
        </button>
        <button class="key key--operator" type="button" data-operator="/" aria-label="Bölme">÷</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>
        <button class="key key--operator" type="button" data-operator="*" aria-label="Çarpma">×</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>
        <button class="key key--operator" type="button" data-operator="-" aria-label="Çıkarma">−</button>

        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>
        <button class="key key--operator" type="button" data-operator="+" aria-label="Toplama">+</button>

        <button class="key key--span-2" type="button" data-digit="0">0</button>
        <button class="key" type="button" data-decimal aria-label="Ondalık ayırıcı">,</button>
        <button class="key key--equals" type="button" data-equals aria-label="Sonucu hesapla">=</button>
      </div>
    </main>

    <noscript>
      <p style="text-align: center; color: #8b9ac4">Hesap makinesini kullanmak için JavaScript'i etkinleştirin.</p>
    </noscript>

    <script>
      (() => {
        "use strict";

        const displayEl = document.getElementById("display");
        const expressionEl = document.getElementById("expression");

        const MAX_DIGITS = 15;
        const SYMBOLS = { "+": "+", "-": "−", "*": "×", "/": "÷" };

        let entry = "0";
        let pending = null;
        let overwrite = true;
        let expression = "";
        let error = false;

        function digitCount(value) {
          return value.replace(/\D/g, "").length;
        }

        function formatNumber(value) {
          if (!Number.isFinite(value)) {
            return "Hata";
          }
          if (Object.is(value, -0)) {
            value = 0;
          }
          if (Number.isSafeInteger(value)) {
            return String(value);
          }
          const magnitude = Math.abs(value);
          if (magnitude >= 1e15 || magnitude < 1e-9) {
            return value
              .toExponential(8)
              .replace(/(\.\d*?)0+e/, "$1e")
              .replace(/\.e/, "e")
              .replace("e+", "e");
          }
          return String(Number(value.toPrecision(12)));
        }

        function calculate(left, operator, right) {
          switch (operator) {
            case "+":
              return left + right;
            case "-":
              return left - right;
            case "*":
              return left * right;
            case "/":
              return right === 0 ? NaN : left / right;
            default:
              return right;
          }
        }

        function render() {
          const text = error ? "Hata" : entry.replace(".", ",").replace(/^-/, "−");
          displayEl.textContent = text;
          displayEl.classList.toggle("is-error", error);
          displayEl.classList.toggle("is-long", !error && text.length > 9 && text.length <= 12);
          displayEl.classList.toggle("is-longer", !error && text.length > 12);
          expressionEl.textContent = expression.replace(/(^|\s)-/g, "$1−").replace(/\./g, ",") || "\u00a0";
        }

        function reset() {
          entry = "0";
          pending = null;
          overwrite = true;
          expression = "";
          error = false;
          render();
        }

        function showError(message) {
          entry = "0";
          pending = null;
          overwrite = true;
          expression = message;
          error = true;
          render();
        }

        function inputDigit(digit) {
          if (error) {
            reset();
          }
          if (overwrite) {
            entry = digit;
            overwrite = false;
          } else if (digitCount(entry) < MAX_DIGITS) {
            entry = entry === "0" ? digit : entry + digit;
          }
          render();
        }

        function inputDecimal() {
          if (error) {
            reset();
          }
          if (overwrite) {
            entry = "0.";
            overwrite = false;
          } else if (!entry.includes(".")) {
            entry += ".";
          }
          render();
        }

        function chooseOperator(operator) {
          if (error) {
            reset();
          }
          if (pending && overwrite) {
            pending.operator = operator;
          } else if (pending) {
            const result = calculate(pending.value, pending.operator, Number(entry));
            if (!Number.isFinite(result)) {
              showError("Sıfıra bölünemez");
              return;
            }
            entry = formatNumber(result);
            pending = { value: Number(entry), operator };
          } else {
            pending = { value: Number(entry), operator };
          }
          expression = `${formatNumber(pending.value)} ${SYMBOLS[operator]}`;
          overwrite = true;
          render();
        }

        function equals() {
          if (error || !pending) {
            return;
          }
          const left = pending.value;
          const operator = pending.operator;
          const right = Number(entry);
          const result = operator === "/" && right === 0 ? NaN : calculate(left, operator, right);
          if (!Number.isFinite(result)) {
            showError("Sıfıra bölünemez");
            return;
          }
          expression = `${formatNumber(left)} ${SYMBOLS[operator]} ${formatNumber(right)} =`;
          entry = formatNumber(result);
          pending = null;
          overwrite = true;
          render();
        }

        function backspace() {
          if (error) {
            reset();
            return;
          }
          if (overwrite) {
            return;
          }
          entry = entry.length > 1 ? entry.slice(0, -1) : "0";
          if (entry === "-" || entry === "") {
            entry = "0";
          }
          render();
        }

        function flash(button) {
          if (!button) {
            return;
          }
          button.classList.add("is-pressed");
          window.setTimeout(() => button.classList.remove("is-pressed"), 110);
        }

        function activate(button) {
          if (button.hasAttribute("data-clear")) {
            reset();
          } else if (button.hasAttribute("data-backspace")) {
            backspace();
          } else if (button.hasAttribute("data-decimal")) {
            inputDecimal();
          } else if (button.hasAttribute("data-equals")) {
            equals();
          } else if (button.hasAttribute("data-digit")) {
            inputDigit(button.getAttribute("data-digit"));
          } else if (button.hasAttribute("data-operator")) {
            chooseOperator(button.getAttribute("data-operator"));
          }
        }

        const keysEl = document.querySelector(".keys");

        keysEl.addEventListener("click", (event) => {
          const button = event.target.closest("button");
          if (!button) {
            return;
          }
          activate(button);
          if (event.detail > 0) {
            button.blur();
          }
        });

        window.addEventListener("keydown", (event) => {
          if (event.ctrlKey || event.metaKey || event.altKey) {
            return;
          }
          const key = event.key;
          let button = null;

          if (/^[0-9]$/.test(key)) {
            inputDigit(key);
            button = document.querySelector(`[data-digit="${key}"]`);
          } else if (key === "." || key === ",") {
            inputDecimal();
            button = document.querySelector("[data-decimal]");
          } else if (key === "+" || key === "-" || key === "*" || key === "/") {
            chooseOperator(key);
            button = document.querySelector(`[data-operator="${key}"]`);
          } else if (key === "Enter" || key === "=") {
            if (event.target instanceof HTMLButtonElement && key === "Enter") {
              return;
            }
            equals();
            button = document.querySelector("[data-equals]");
          } else if (key === "Backspace") {
            backspace();
            button = document.querySelector("[data-backspace]");
          } else if (key === "Escape" || key === "Delete") {
            reset();
            button = document.querySelector("[data-clear]");
          } else {
            return;
          }

          event.preventDefault();
          flash(button);
        });

        render();
      })();
    </script>
  </body>
</html>
